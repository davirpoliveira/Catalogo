<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>
    <link rel="stylesheet" href="src/css/catalog.css">
</head>

<body>
    <header>
        <section id="mainHeader" class="flex">
            <h1>Tectoon</h1>
            <h3>Uma Loja Que Você Precisa</h3>
        </section>
    </header>
    <div class="layout">
        <aside id="sidebar">
            <section id="lowHeader" class="flex">
                <h3>Pesquisa</h3>
                <form id="formPesquisa">
                    <label for="categoria">Pesquise aqui</label>
                    <input type="search" id="categoria" name="NomeCategoria" placeholder="Ex: Dell, PlayStation...">
                    <input type="submit" value="Pesquisar">
                </form>
            </section>
            <section id="midHeader" class="flex">
                <h3>Categorias, clique para filtrar</h3>
                <div id="categorias"></div>
            </section>
        </aside>
        <main>
            <section id="mainCatalog">

            </section>
        </main>
    </div>
    <script type="module" src="Js/index.js"></script>
</body>

</html>
